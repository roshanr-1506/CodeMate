services:
  - type: web
    name: codemate-2
    runtime: docker
    preDeployCommand: node .data/tools/scripts/migrate.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_SSL
        value: 'true'
